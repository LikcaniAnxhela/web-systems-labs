
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid and Card</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>

    <div class="container">

        <div class="row">
            <div class="col-md-2 bg-info">left</div>
            <div class="col-md-7 bg-light">main</div>
            <div class="col-md-3 bg-warning">right</div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Card Title</h5>
                <p class="card-text">Description text</p>
                <button class="btn btn-success">Button</button>            </div>
        </div>

    </div>

</body>
</html>
